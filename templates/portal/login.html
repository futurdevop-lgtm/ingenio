{% extends 'portal/base.html' %}
{% block title %}Connexion - Plateforme de Talents{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-3">Connexion</h2>
    <form method="post" class="card-bg p-3 rounded-3" action="">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>
  </div>
</div>
{% endblock %}
