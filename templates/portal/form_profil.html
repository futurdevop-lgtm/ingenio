{% extends 'portal/base.html' %}
{% block title %}{{ titre }} - Plateforme de Talents{% endblock %}
{% block content %}
<h2 class="mb-3">{{ titre }}</h2>
<form method="post" enctype="multipart/form-data" class="card-bg p-3 rounded-3">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-success">Enregistrer</button>
  <a href="/app/profils/" class="btn btn-secondary ms-2">Annuler</a>
</form>
{% endblock %}
