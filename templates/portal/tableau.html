{% extends 'portal/base.html' %}
{% block title %}Tableau - IngenioManager{% endblock %}
{% block content %}
<h2 class="mb-3">Tableau de bord</h2>
<div class="row g-3">
  <div class="col-md-4">
    <div class="card-bg p-3">
      <div class="text-muted">Ingénieurs</div>
      <div class="fs-3 fw-bold">{{ stats.nb_ingenieurs }}</div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card-bg p-3">
      <div class="text-muted">Projets</div>
      <div class="fs-3 fw-bold">{{ stats.nb_projets }}</div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card-bg p-3">
      <div class="text-muted">Navigation</div>
      <div class="mt-2">
        <a class="btn btn-primary btn-sm me-2" href="/app/profils/">Profils</a>
        <a class="btn btn-primary btn-sm me-2" href="/app/projets/">Projets</a>
        <a class="btn btn-primary btn-sm" href="/app/recherche/">Recherche</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
