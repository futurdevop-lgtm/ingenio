{% extends 'portal/base.html' %}
{% block title %}{{ titre }} - IngenioManager{% endblock %}
{% block content %}
<h2 class="mb-3">{{ titre }}</h2>
<form method="post" class="card-bg p-3 rounded-3">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-success" type="submit">Enregistrer</button>
  <a href="/app/incidents/" class="btn btn-secondary ms-2">Annuler</a>
</form>
{% endblock %}
